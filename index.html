<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VILLAE Communication — Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&amp;family=Manrope:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.vc{--bg:#0B0B0C;--surface:#131315;--surface2:#1C1C1F;--ink:#F2F0EC;--muted:#A09D97;--line:rgba(242,240,236,.12);--line2:rgba(242,240,236,.35);--accent:#FF5A36;--accent-hi:#FF7656;--accent-text:#FF7A5C;--on-accent:#0B0B0C;--ph:#1C1C1F;--glow:rgba(255,90,54,.4);background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;transition:background-color .5s ease,color .5s ease}
.vc.light{--bg:#F3F1EC;--surface:#E9E6DF;--surface2:#DDD9D0;--ink:#121212;--muted:#55524C;--line:#D4D0C6;--line2:#8F8B83;--accent:#E8431F;--accent-hi:#FF5A36;--accent-text:#B8320F;--on-accent:#121212;--ph:#DDD9D0;--glow:rgba(232,67,31,.35)}
.vc header,.vc section{transition:background-color .5s ease,color .5s ease,border-color .5s ease}
.vc-d{font-family:Syne,system-ui,sans-serif;font-weight:700;letter-spacing:-.02em}
a{color:var(--accent-text)}
.vc-link{position:relative;display:inline-block;overflow:hidden;padding:12px 2px;margin:0 10px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;line-height:1.2}
.vc-link span{display:block;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.vc-link span::after{content:attr(data-t);position:absolute;left:0;top:100%;color:var(--accent-text)}
.vc-link:hover span{transform:translateY(-100%)}
.vc-link.on{color:var(--accent-text)}
.vc-btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:18px 30px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.2,1),color .35s,border-color .35s,box-shadow .35s}
.vc-arr{display:inline-block;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.vc-btn:hover .vc-arr{transform:rotate(-45deg)}
.vc-btn:active{transform:scale(.96)}
.vc-solid{background:var(--accent);color:var(--on-accent)}
.vc-solid::before{content:"";position:absolute;left:50%;top:50%;width:0;height:0;z-index:-1;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);transition:width .55s cubic-bezier(.2,.7,.2,1),height .55s cubic-bezier(.2,.7,.2,1)}
.vc-solid:hover{color:var(--bg);box-shadow:0 18px 40px -18px var(--glow)}
.vc-solid:hover::before{width:340px;height:340px}
.vc-ghost{color:var(--ink);border-color:var(--line2);background:transparent}
.vc-ghost::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.vc-ghost:hover{color:var(--on-accent);border-color:var(--accent)}
.vc-ghost:hover::before{transform:scaleX(1);transform-origin:left}
.vc-seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px}
.vc-sb{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:background-color .3s,color .3s}
.vc-sb svg{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vc-sb:hover{color:var(--ink);background:var(--surface2)}
.vc-sb:hover svg{transform:rotate(-25deg) scale(1.1)}
.vc-sb.on{background:var(--accent);color:var(--on-accent)}
.vc-rot{display:inline-grid;vertical-align:top;white-space:nowrap}
.vc-rot>span{grid-area:1/1;color:var(--accent-text);opacity:0;animation:vc-word 12s cubic-bezier(.2,.7,.2,1) infinite}
.vc-rot>span:nth-child(2){animation-delay:3s}
.vc-rot>span:nth-child(3){animation-delay:6s}
.vc-rot>span:nth-child(4){animation-delay:9s}
@keyframes vc-word{0%{opacity:0;transform:translateY(.3em)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-.3em)}}
@keyframes vc-spin{to{transform:rotate(360deg)}}
.vc-badge{width:150px;height:150px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;color:var(--ink);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vc-badge svg.ring{position:absolute;inset:0;animation:vc-spin 18s linear infinite}
.vc-badge .core{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vc-badge:hover{transform:scale(1.08)}
.vc-badge:hover .core{transform:rotate(-45deg) scale(1.15)}
@keyframes vc-mq{to{transform:translateX(-50%)}}
.vc-mq{display:flex;width:max-content;animation:vc-mq 30s linear infinite}
.vc-band:hover .vc-mq{animation-play-state:paused}
.vc-img{position:relative;overflow:hidden;background:var(--ph)}
.vc-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.7,.2,1),filter .6s}
.vc-strip .vc-img{border-radius:18px;transition:flex-grow .7s cubic-bezier(.2,.7,.2,1)}
.vc-strip .vc-img:hover{flex-grow:2}
.vc-row{position:relative;isolation:isolate;display:grid;grid-template-columns:70px minmax(0,1.2fr) minmax(0,1fr) 56px;align-items:center;gap:24px;padding:34px 24px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);overflow:hidden;transition:color .4s}
.vc-row::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vc-row:hover{color:var(--on-accent)}
.vc-row:hover::before{transform:scaleY(1)}
.vc-row .num,.vc-row .desc{color:var(--muted);transition:color .4s}
.vc-row:hover .num,.vc-row:hover .desc{color:var(--on-accent)}
.vc-row .ar{width:52px;height:52px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vc-row:hover .ar{transform:rotate(-45deg)}
.vc-proj{position:relative;display:block;border-radius:22px;overflow:hidden;text-decoration:none;color:#FFFFFF;isolation:isolate;background:var(--ph)}
.vc-proj img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.vc-proj::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 100%);opacity:.7;transition:opacity .5s}
.vc-proj .cap{position:absolute;left:28px;right:28px;bottom:26px;z-index:2;display:flex;flex-direction:column;gap:8px;transform:translateY(14px);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vc-proj .more{opacity:0;transition:opacity .4s}
.vc-proj:hover img{transform:scale(1.07)}
.vc-proj:hover::after{opacity:1}
.vc-proj:hover .cap{transform:none}
.vc-proj:hover .more{opacity:1}
.vc-pill{align-self:flex-start;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.vc-step{display:flex;flex-direction:column;gap:14px;padding:30px;border:1px solid var(--line);border-radius:22px;transition:border-color .4s,transform .4s cubic-bezier(.2,.7,.2,1),background-color .4s}
.vc-step:hover{border-color:var(--accent);transform:translateY(-6px);background:var(--surface2)}
.vc-step .k{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-text)}
.vc-big{display:inline-flex;align-items:center;gap:.3em;text-decoration:none;color:var(--ink);background:linear-gradient(var(--accent),var(--accent)) left 92%/0 .08em no-repeat;transition:background-size .6s cubic-bezier(.2,.7,.2,1),color .4s}
.vc-big:hover{background-size:100% .08em;color:var(--accent-text)}
.vc-big .vc-arr{font-size:.7em}
.vc-big:hover .vc-arr{transform:rotate(-45deg)}
.vc-grp{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:300px;padding:32px;border-radius:22px;overflow:hidden;text-decoration:none;color:#FFFFFF;isolation:isolate}
.vc-grp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.vc-grp::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.82) 100%)}
.vc-grp:hover img{transform:scale(1.06)}
.vc-grp:hover .vc-arr{transform:rotate(-45deg)}
.vc-flink{color:#A09D97;text-decoration:none;transition:color .3s}
.vc-flink:hover{color:#FF7A5C}
@keyframes vc-up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.vc-up{animation:vc-up 1s cubic-bezier(.2,.7,.2,1) both}
@media (max-width: 720px){.vc-row{grid-template-columns:44px minmax(0,1fr) 52px}.vc-row .desc{display:none}}
@media (prefers-reduced-motion: reduce){.vc-mq,.vc-badge svg.ring{animation-play-state:paused}.vc-rot>span{animation:none}.vc-rot>span:first-child{opacity:1}}
</style>
<script src="js/dc-lite.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Ce site nécessite JavaScript.</p></noscript>
<template id="dc-tpl">


<div class="vc {{themeClass}}" style="width: 100%; min-height: 100vh">


  <!-- HEADER -->
  <header style="position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--line)">
    <div style="max-width: 1320px; margin: 0 auto; padding: 14px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px">
      <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink)">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" style="stroke: var(--ink)" stroke-width="1.5"></circle><circle cx="27" cy="13" r="5" style="fill: var(--accent)"></circle></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.05">
          <span class="vc-d" style="font-size: 20px; font-weight: 800; letter-spacing: 0.02em">VILLAE</span>
          <span style="font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted)">Communication</span>
        </span>
      </a>
      <nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
        <a href="index.html" class="vc-link on"><span data-t="Accueil">Accueil</span></a>
        <a href="#expertises" class="vc-link"><span data-t="Expertises">Expertises</span></a>
        <a href="projets.html" class="vc-link"><span data-t="Projets">Projets</span></a>
        <a href="#studio" class="vc-link"><span data-t="Studio">Studio</span></a>
        <a href="contact.html" class="vc-link"><span data-t="Contact">Contact</span></a>
        <div class="vc-seg" role="group" aria-label="Thème d'affichage" style="margin-left: 10px">
          <button type="button" class="vc-sb {{segDark}}" aria-pressed="{{pDark}}" aria-label="Thème sombre" title="Sombre" onClick="{{toDark}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"></path></svg></button>
          <button type="button" class="vc-sb {{segLight}}" aria-pressed="{{pLight}}" aria-label="Thème clair" title="Clair" onClick="{{toLight}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"></path></svg></button>
          <button type="button" class="vc-sb {{segAuto}}" aria-pressed="{{pAuto}}" aria-label="Suivre le réglage de l'appareil" title="Auto" onClick="{{toAuto}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12.5" rx="1.5"></rect><path d="M9 20.5h6M12 16.5v4"></path></svg></button>
        </div>
        <a href="contact.html" class="vc-btn vc-solid" style="margin-left: 10px; padding: 13px 22px">Lancer un projet <span class="vc-arr">→</span></a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section style="max-width: 1320px; margin: 0 auto; padding: 96px 40px 56px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 40px">
      <h1 class="vc-d vc-up" style="margin: 0; flex: 1 1 760px; font-weight: 800; font-size: clamp(48px, 7.4vw, 120px); line-height: 0.95; letter-spacing: -0.04em; text-transform: uppercase">On fait<br>parler les<br><span class="vc-rot" aria-label="marques, lieux, talents, idées"><span aria-hidden="true">marques.</span><span aria-hidden="true">lieux.</span><span aria-hidden="true">talents.</span><span aria-hidden="true">idées.</span></span></h1>
      <a href="contact.html" class="vc-badge" aria-label="Démarrer un projet">
        <svg class="ring" viewBox="0 0 150 150" aria-hidden="true"><defs><path id="vc-c" d="M75 75m-58 0a58 58 0 1 1 116 0a58 58 0 1 1-116 0"></path></defs><text font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="3.2" style="fill: var(--ink)"><textPath href="#vc-c">STUDIO CRÉATIF · VILLAE COMMUNICATION · </textPath></text></svg>
        <span class="core"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </a>
    </div>
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--line)">
      <p class="vc-up" style="margin: 0; max-width: 520px; font-size: 18px; line-height: 1.65; color: var(--muted); animation-delay: .15s">Studio de création et de communication du groupe VILLAE. Identités de marque, campagnes digitales, événements et contenus : on conçoit, on produit, on diffuse.</p>
      <div class="vc-up" style="display: flex; flex-wrap: wrap; gap: 12px; animation-delay: .25s"><a href="projets.html" class="vc-btn vc-solid">Voir nos projets <span class="vc-arr">→</span></a><a href="contact.html" class="vc-btn vc-ghost">Parlons-en</a></div>
    </div>
  </section>

  <!-- BANDE D'IMAGES -->
  <section style="max-width: 1320px; margin: 0 auto; padding: 0 40px 110px">
    <div class="vc-strip" style="display: flex; gap: 14px; height: 440px">
      <div class="vc-img" style="flex: 1 1 0"><img src="assets/c-photostudio.jpg" alt="Studio photo éclairé en rose et orange"></div>
      <div class="vc-img" style="flex: 1 1 0"><img src="assets/c-samples.jpg" alt="Échantillons de matières et carnet sur une table de travail"></div>
      <div class="vc-img" style="flex: 1 1 0"><img src="assets/c-stage.jpg" alt="Scène d'événement éclairée en violet"></div>
      <div class="vc-img" style="flex: 1 1 0"><img src="assets/c-lettering.jpg" alt="Main dessinant un lettrage au crayon"></div>
    </div>
  </section>

  <!-- MARQUEE -->
  <div class="vc-band" style="background: var(--accent); color: var(--on-accent); overflow: hidden; padding: 26px 0" aria-label="Nos disciplines : branding, digital, événementiel, production, social media, relations presse">
    <div class="vc-mq" aria-hidden="true">
      <span class="vc-d" style="display: flex; gap: 48px; padding-right: 48px; font-size: clamp(28px, 3.4vw, 46px); font-weight: 800; text-transform: uppercase; white-space: nowrap">
        <span>Branding</span><span>✦</span><span>Digital</span><span>✦</span><span>Événementiel</span><span>✦</span><span>Production</span><span>✦</span><span>Social media</span><span>✦</span><span>Relations presse</span><span>✦</span>
      </span>
      <span class="vc-d" style="display: flex; gap: 48px; padding-right: 48px; font-size: clamp(28px, 3.4vw, 46px); font-weight: 800; text-transform: uppercase; white-space: nowrap">
        <span>Branding</span><span>✦</span><span>Digital</span><span>✦</span><span>Événementiel</span><span>✦</span><span>Production</span><span>✦</span><span>Social media</span><span>✦</span><span>Relations presse</span><span>✦</span>
      </span>
    </div>
  </div>

  <!-- EXPERTISES -->
  <section id="expertises" style="max-width: 1320px; margin: 0 auto; padding: 130px 40px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 56px">
      <h2 class="vc-d" style="margin: 0; font-weight: 800; font-size: clamp(40px, 5.4vw, 80px); line-height: 0.95; letter-spacing: -0.035em; text-transform: uppercase">Ce qu'on<br>sait faire</h2>
      <p style="margin: 0; max-width: 400px; font-size: 16px; line-height: 1.7; color: var(--muted)">Six expertises intégrées, pilotées par une seule équipe — pour que votre marque parle d'une seule voix.</p>
    </div>
    <div style="border-bottom: 1px solid var(--line)">
      <a href="projets.html" class="vc-row"><span class="num" style="font-family: 'JetBrains Mono', monospace; font-size: 13px">01</span><span class="vc-d" style="font-size: clamp(26px, 3vw, 42px); font-weight: 700">Identité &amp; branding</span><span class="desc" style="font-size: 15px; line-height: 1.6">Plateforme de marque, logo, charte, naming.</span><span class="ar"><span class="vc-arr" style="font-size: 20px">→</span></span></a>
      <a href="projets.html" class="vc-row"><span class="num" style="font-family: 'JetBrains Mono', monospace; font-size: 13px">02</span><span class="vc-d" style="font-size: clamp(26px, 3vw, 42px); font-weight: 700">Digital &amp; web</span><span class="desc" style="font-size: 15px; line-height: 1.6">Sites, campagnes en ligne, SEO et performance.</span><span class="ar"><span class="vc-arr" style="font-size: 20px">→</span></span></a>
      <a href="projets.html" class="vc-row"><span class="num" style="font-family: 'JetBrains Mono', monospace; font-size: 13px">03</span><span class="vc-d" style="font-size: clamp(26px, 3vw, 42px); font-weight: 700">Social media</span><span class="desc" style="font-size: 15px; line-height: 1.6">Stratégie éditoriale, community management, influence.</span><span class="ar"><span class="vc-arr" style="font-size: 20px">→</span></span></a>
      <a href="projets.html" class="vc-row"><span class="num" style="font-family: 'JetBrains Mono', monospace; font-size: 13px">04</span><span class="vc-d" style="font-size: clamp(26px, 3vw, 42px); font-weight: 700">Événementiel</span><span class="desc" style="font-size: 15px; line-height: 1.6">Lancements, salons, soirées, conventions.</span><span class="ar"><span class="vc-arr" style="font-size: 20px">→</span></span></a>
      <a href="projets.html" class="vc-row"><span class="num" style="font-family: 'JetBrains Mono', monospace; font-size: 13px">05</span><span class="vc-d" style="font-size: clamp(26px, 3vw, 42px); font-weight: 700">Production photo &amp; vidéo</span><span class="desc" style="font-size: 15px; line-height: 1.6">Shootings, films de marque, motion design.</span><span class="ar"><span class="vc-arr" style="font-size: 20px">→</span></span></a>
      <a href="projets.html" class="vc-row"><span class="num" style="font-family: 'JetBrains Mono', monospace; font-size: 13px">06</span><span class="vc-d" style="font-size: clamp(26px, 3vw, 42px); font-weight: 700">Relations presse</span><span class="desc" style="font-size: 15px; line-height: 1.6">Dossiers de presse, relations médias, e-réputation.</span><span class="ar"><span class="vc-arr" style="font-size: 20px">→</span></span></a>
    </div>
  </section>

  <!-- PROJETS -->
  <section style="background: var(--surface); border-top: 1px solid var(--line)">
    <div style="max-width: 1320px; margin: 0 auto; padding: 130px 40px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 56px">
        <h2 class="vc-d" style="margin: 0; font-weight: 800; font-size: clamp(40px, 5.4vw, 80px); line-height: 0.95; letter-spacing: -0.035em; text-transform: uppercase">Projets<br>choisis</h2>
        <a href="projets.html" class="vc-btn vc-ghost">Tous les projets <span class="vc-arr">→</span></a>
      </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":7300}}'>
class Component extends DCLogic {
  componentDidMount() {
    let t = 'dark';
    try { t = window.localStorage.getItem('vpm-theme') || 'dark'; } catch (e) {}
    let sys = true;
    try {
      this.mq = window.matchMedia('(prefers-color-scheme: dark)');
      sys = this.mq.matches;
      this.onMq = (e) => this.setState({ sysDark: e.matches });
      this.mq.addEventListener('change', this.onMq);
    } catch (e) {}
    this.setState({ theme: t, sysDark: sys });
  }
  componentWillUnmount() { try { this.mq.removeEventListener('change', this.onMq); } catch (e) {} }
  setTheme(t) {
    this.setState({ theme: t });
    try { window.localStorage.setItem('vpm-theme', t); } catch (e) {}
  }
  renderVals() {
    const s = this.state || {};
    const t = s.theme || 'dark';
    const dark = t === 'auto' ? s.sysDark !== false : t === 'dark';
    return {
      themeClass: dark ? '' : 'light',
      segDark: t === 'dark' ? 'on' : '', segLight: t === 'light' ? 'on' : '', segAuto: t === 'auto' ? 'on' : '',
      pDark: String(t === 'dark'), pLight: String(t === 'light'), pAuto: String(t === 'auto'),
      toDark: () => this.setTheme('dark'), toLight: () => this.setTheme('light'), toAuto: () => this.setTheme('auto')
    };
  }
}
</script>
